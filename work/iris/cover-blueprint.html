<!doctype html>
<html><head><meta charset="utf-8">
<!-- Iris cover, option D "Blueprint": one idea, from Anna's purple Figma frames. The mark's
     construction drawing draws itself in, the 3D mark resolves on top of it, and the Fay app
     sits beside it, light then dark. Drawn at 1600×1000. -->
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1600px;height:1000px;overflow:hidden}
html{background:transparent}
body{transform-origin:0 0;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#6a5cff 0%,#5f48f6 55%,#5638ec 100%)}
.abs{position:absolute}
/* same margin above, below and to the right of the drawing's frame */
/* The drawing comes in two layers. The 3D mark's petals are slimmer than the drawn ones and its
   aperture is cut through, so the drawn flower would show around and inside it: that layer fades out
   as the mark lands, and the frame, labels and construction lines stay */
#blue,#petals{left:650px;top:50px;width:900px;height:900px;background:#fff;opacity:.9}
#blue{-webkit-mask:url(iris-mark-blueprint-frame.png) center/contain no-repeat;mask:url(iris-mark-blueprint-frame.png) center/contain no-repeat}
#petals{-webkit-mask:url(iris-mark-blueprint-flower.png) center/contain no-repeat;mask:url(iris-mark-blueprint-flower.png) center/contain no-repeat}
/* Measured so the 3D mark lands on its drawing: the drawing's centre lines cross at (499, 442) of
   its 1000px image, its outer ring is r 130 and its petal tips r 321; the 3D mark's centre is
   (379.5, 361.5) of 760px, ring r 98.5, tips r 248.5. Hence 893px, centred on (1099, 448) */
#mark{left:653px;top:23px;width:893px;height:893px;filter:drop-shadow(0 40px 60px rgba(30,10,120,.35))}
#phone{left:180px;top:140px;width:330px;height:715px;border-radius:46px;overflow:hidden;
  box-shadow:0 2px 4px rgba(20,10,80,.2),0 50px 90px -30px rgba(20,10,80,.55)}
#phone img{position:absolute;inset:0;width:100%;height:100%}
#dark{clip-path:inset(0 100% 0 0)}
</style></head>
<body>
<div class="abs" id="blue"></div>
<div class="abs" id="petals"></div>
<img src="iris-mark-blueprint-frame.png" alt="" hidden><img src="iris-mark-blueprint-flower.png" alt="" hidden><!-- load the masks before the drawing starts -->
<img class="abs" id="mark" src="iris-mark-3d-lg.png" alt="">
<div class="abs" id="phone"><img src="home-light.png" alt=""><img id="dark" src="home-dark.png" alt=""></div>
<script>
const clamp=v=>Math.max(0,Math.min(1,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const out=t=>1-Math.pow(1-t,3);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const $=id=>document.getElementById(id);
const DUR=12;
window.render=function(t){
  const first=t;t=t%DUR;
  const w=2*Math.PI*t/DUR;
  // the construction drawing opens out from the centre, the way a compass would draw it
  const b=ease(seg(t,.2,2.4))*(1-seg(t,11.2,11.8));
  $('blue').style.clipPath=$('petals').style.clipPath=`circle(${b*72}% at 50% 50%)`;
  // the 3D mark resolves on top of its own drawing and stays there
  const m=out(seg(t,2.0,3.0))*(1-seg(t,11.0,11.6));
  $('mark').style.opacity=m;
  $('petals').style.opacity=.9*(1-m);
  $('mark').style.transform=`translateY(${(1-m)*16}px) scale(${.94+.06*m})`; // settles exactly on its drawing
  // the app comes in once, then turns dark and back
  const p=out(seg(first,.6,1.6));
  $('phone').style.opacity=p;
  $('phone').style.transform=`translateY(${(1-p)*30+Math.sin(w+1.4)*7}px) rotate(-4deg)`;
  const d=ease(seg(t,4.6,5.7))*(1-ease(seg(t,8.4,9.5)));
  $('dark').style.clipPath=`inset(0 ${(1-d)*100}% 0 0)`;
};
</script>
<script src="play.js" data-still="6.5"></script>
</body></html>
