<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Manrope;src:url(../../fonts/manrope-400-latin.woff2)}
*{box-sizing:border-box;margin:0}
html,body{width:1600px;height:1000px;overflow:hidden}
html{background:transparent}
body{transform-origin:0 0}
body{background:transparent;color:#1d2a30;font-family:Manrope,-apple-system,sans-serif;position:relative}
.b{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
   font-weight:500;will-change:transform}
.b svg{flex:none}
.cap{position:absolute;left:96px;top:72px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:20px;letter-spacing:.01em}
.cap small{display:block;font-family:Manrope;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#7a868b;margin-bottom:10px}
</style></head>
<body>
<div class="cap" id="c1"><small>Before</small>123 buttons written by hand · 95 files · 3 radii</div>
<div class="cap" id="c2"><small>Iris</small>One button · 5 variants · 5 states</div>
<div id="stage"></div>
<script>
// seeded random
let seed=7;const R=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const pick=a=>a[Math.floor(R()*a.length)];
const clamp=v=>Math.max(0,Math.min(1,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const out=t=>1-Math.pow(1-t,3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lerp=(a,b,k)=>a+(b-a)*k;
const mixc=(a,b,k)=>`rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],k))).join(',')})`;

// Iris sheet: columns = variants, rows = states (from the Figma sheet)
const SHEET=[
 // [bg, border, text]
 [['#6a5cff','#6a5cff','#ffffff'],['#f5f4ff','#e2deff','#6a5cff'],['#ffffff','#dddddd','#1d1d1f'],['#f9f7f0','#f9f7f0','#6a5cff'],['#e02424','#e02424','#ffffff']],
 [['#4a3fd6','#4a3fd6','#ffffff'],['#e7e4ff','#e7e4ff','#6a5cff'],['#f6f6f6','#e4e4e4','#1d1d1f'],['#f3f3f5','#f3f3f5','#6a5cff'],['#b91c1c','#b91c1c','#ffffff']],
 [['#3a2fb0','#3a2fb0','#ffffff'],['#e7e4ff','#e7e4ff','#6a5cff'],['#e4e4e4','#e4e4e4','#1d1d1f'],['#f9f7f0','#f9f7f0','#3a2fb0'],['#ef4444','#dc2626','#ffffff']],
 [['#6a5cff','#2e2690','#ffffff'],['#f5f4ff','#b9b1ff','#6a5cff'],['#ffffff','#cfcfcf','#1d1d1f'],['#f9f7f0','#f9f7f0','#6a5cff'],['#e02424','#7f1010','#ffffff']],
 [['#b5aeff','#b5aeff','#ffffff'],['#f8f7ff','#eeebff','#c3bdff'],['#e6e6e6','#e6e6e6','#9a9a9a'],['#f9f7f0','#f9f7f0','#c3bdff'],['#ef9a9a','#ef9a9a','#ffffff']],
];
const COLS=5,ROWS=5,BW=150,BH=54,GX=40,GY=34;
const gx0=(1600-(COLS*BW+(COLS-1)*GX))/2, gy0=330;
const slot=i=>{const c=i%COLS,r=Math.floor(i/COLS)%ROWS;return {x:gx0+c*(BW+GX),y:gy0+r*(BH+GY),s:SHEET[r][c]}};

// messy palette: near-miss purples, a few outlines and reds
const MESS=[['#6a5cff','#6a5cff','#ffffff'],['#7c6cf0','#7c6cf0','#ffffff'],['#5b4fe0','#5b4fe0','#ffffff'],['#6366f1','#6366f1','#ffffff'],
 ['#8b7dff','#8b7dff','#ffffff'],['#ffffff','#6a5cff','#6a5cff'],['#ffffff','#c9c9c9','#333333'],['#efedff','#efedff','#5b4fe0'],
 ['#e53935','#e53935','#ffffff'],['#4f46e5','#4f46e5','#ffffff'],['#7367f0','#5b4fe0','#ffffff']];
const LABELS=['Book now','Continue','Join','Join appointment','Submit','Next','Save','Get started','Book','Confirm','See all','Done','Copy link','Start quiz','Cancel','Reschedule','Send','Add','Log in','Upload'];
const RADII=[6,10,999];
const icon=c=>`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="1.5"><path d="M1 5V2.5A1.5 1.5 0 0 1 2.5 1H5M11 1h2.5A1.5 1.5 0 0 1 15 2.5V5M15 11v2.5a1.5 1.5 0 0 1-1.5 1.5H11M5 15H2.5A1.5 1.5 0 0 1 1 13.5V11M8 5v6M5 8h6"/></svg>`;

const N=123, stage=document.getElementById('stage'), B=[];
for(let i=0;i<N;i++){
  const m=pick(MESS), h=Math.round(lerp(34,52,R())), fs=Math.round(lerp(13,17,R()));
  const label=pick(LABELS), w=Math.round(label.length*fs*0.58+lerp(28,52,R()));
  const b={i, x:lerp(40,1600-w-40,R()), y:lerp(170,960-h,R()), rot:lerp(-9,9,R()), w,h,fs,rad:pick(RADII),m:m.map(hex),label,
    delay:R()*1.4, fly:R()*0.55, s:slot(i)};
  b.sc=b.s.s.map(hex);
  const el=document.createElement('div');el.className='b';
  el.innerHTML=`<span class="ic" style="display:none"></span><span class="t"></span>`;
  stage.appendChild(el);b.el=el;b.t=el.querySelector('.t');b.ic=el.querySelector('.ic');B.push(b);
}
const $=id=>document.getElementById(id);

const DUR=9.6;
window.render=function(t){
  t=t%DUR;
  for(const b of B){
    const pop=out(seg(t,.25+b.delay,.6+b.delay));
    const k=ease(seg(t,3.6+b.fly,4.9+b.fly));                     // fly into the sheet
    const fade=1-seg(t,8.7,9.4);                                   // loop out
    const x=lerp(b.x,b.s.x,k), y=lerp(b.y,b.s.y,k), w=lerp(b.w,BW,k), h=lerp(b.h,BH,k);
    const rot=lerp(b.rot,0,k), rad=Math.min(lerp(Math.min(b.rad,h/2),BH/2,k),h/2);
    const e=b.el,st=e.style;
    st.width=w+'px';st.height=h+'px';st.borderRadius=rad+'px';
    st.transform=`translate(${x}px,${y}px) rotate(${rot}deg) scale(${lerp(.6,1,pop)})`;
    st.opacity=pop*fade*(b.i<25||k<.98?1:0);
    st.zIndex=b.i<25?2:1;
    st.background=mixc(b.m[0],b.sc[0],k);st.border='1px solid '+mixc(b.m[1],b.sc[1],k);
    st.color=mixc(b.m[2],b.sc[2],k);st.fontSize=lerp(b.fs,15,k)+'px';
    const sheet=k>.5;
    if(b._s!==sheet){b._s=sheet;b.t.textContent=sheet?'{Label}':b.label;
      b.ic.style.display=sheet?'block':'none';b.ic.innerHTML=icon(b.s.s[2]);}
    b.t.style.opacity=Math.abs(k-.5)*2;b.ic.style.opacity=Math.abs(k-.5)*2;
  }
  const c1=out(seg(t,1.6,2.2))*(1-seg(t,3.4,3.8)), c2=out(seg(t,5.2,5.8))*(1-seg(t,8.7,9.2));
  $('c1').style.opacity=c1;$('c1').style.transform=`translateY(${(1-c1)*8}px)`;
  $('c2').style.opacity=c2;$('c2').style.transform=`translateY(${(1-c2)*8}px)`;
};
document.fonts.ready.then(()=>{render(0);window.ready=true;});
</script>
<script>
// Played live on the case study page, over the page's grid paper: scale the 1600×1000 drawing
// to the frame, run it only while it's on screen, and hold one frame under reduced motion
(() => {
  const STILL = 6.5;
  const fit = () => { document.body.style.transform = `scale(${innerWidth / 1600})`; };
  addEventListener('resize', fit);
  fit();
  // ?t=4.2 holds that moment, for checking a frame
  const at = new URLSearchParams(location.search).get('t');
  const still = at !== null || matchMedia('(prefers-reduced-motion: reduce)').matches;
  let visible = false, raf, last, t = 0;
  const loop = (now) => {
    t += last === undefined ? 0 : (now - last) / 1000;
    last = now;
    render(t);
    raf = requestAnimationFrame(loop);
  };
  const start = () => {
    if (still) return render(at !== null ? Number(at) : STILL);
    if (!visible || raf) return;
    last = undefined;
    raf = requestAnimationFrame(loop);
  };
  const stop = () => { cancelAnimationFrame(raf); raf = undefined; };
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; visible ? start() : stop(); })
    .observe(document.documentElement);
  document.fonts.ready.then(start);
})();
</script>
</body></html>
